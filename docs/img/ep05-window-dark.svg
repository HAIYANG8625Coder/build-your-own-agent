<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ece8e1"/></marker><marker id="aaccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="agrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f6a63"/></marker></defs>
  <rect width="1200" height="520" fill="#0d1117"/>
  <text x="40" y="52" font-size="21" font-weight="700" fill="#ece8e1">What fills the window: a real run, turn 25 of 25 (no management)</text>
  <rect x="40" y="100" width="1120" height="150" rx="14" fill="#1c1a17"/>
  <text x="600" y="138" font-size="17" font-weight="700" fill="#ece8e1" text-anchor="middle">The window, about 25,000 tokens</text>
  <rect x="60" y="150" width="34" height="70" rx="4" fill="#8f8a82"/>
  <rect x="94" y="150" width="1046" height="70" rx="4" fill="#f0883e"/>
  <text x="60" y="280" font-size="20" font-weight="700" fill="#aca69d">system prompt + tools + task + notes</text>
  <text x="60" y="306" font-size="24" font-weight="800" fill="#ece8e1">about 800</text>
  <text x="1140" y="280" font-size="20" font-weight="700" fill="#f0883e" text-anchor="end">24 file reads, about 1,000 tokens each</text>
  <text x="1140" y="306" font-size="24" font-weight="800" fill="#f0883e" text-anchor="end">about 24,500</text>
  <rect x="40" y="350" width="1120" height="140" rx="14" fill="#1c1a17"/>
  <text x="600" y="388" font-size="17" font-weight="700" fill="#ece8e1" text-anchor="middle">Every turn sends the whole history again</text>
  <text x="70" y="412" font-size="17" font-weight="700" fill="#aca69d">turn 5</text>
  <rect x="70" y="424" width="43.5417" height="14" rx="4" fill="#f0883e"/>
  <text x="288" y="412" font-size="17" font-weight="700" fill="#aca69d">turn 10</text>
  <rect x="288" y="424" width="79.1667" height="14" rx="4" fill="#f0883e"/>
  <text x="506" y="412" font-size="17" font-weight="700" fill="#aca69d">turn 15</text>
  <rect x="506" y="424" width="114.792" height="14" rx="4" fill="#f0883e"/>
  <text x="724" y="412" font-size="17" font-weight="700" fill="#aca69d">turn 20</text>
  <rect x="724" y="424" width="150.417" height="14" rx="4" fill="#f0883e"/>
  <text x="942" y="412" font-size="17" font-weight="700" fill="#aca69d">turn 25</text>
  <rect x="942" y="424" width="190" height="14" rx="4" fill="#f0883e"/>
  <text x="70" y="470" font-size="19" font-weight="400" fill="#8f8a82">The longer the history, the more each turn sends, and the more the model has to sift (context rot).</text>
</svg>

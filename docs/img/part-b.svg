  <path d="M274,190 L326,190" fill="none" stroke="#d4600b" stroke-width="2.5" marker-end="url(#aaccent)"/>
  <rect x="330" y="140" width="220" height="100" rx="10" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>

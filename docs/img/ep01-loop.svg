<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker><marker id="aaccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d4600b"/></marker><marker id="agrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8a49c"/></marker></defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="40" y="50" font-size="21" font-weight="700" fill="#1f1f1f">The agent loop · run() in agent.py</text>
  <text x="40" y="80" font-size="17" font-weight="400" fill="#8a8a8a">Orange: the path each turn takes. Grey: the loop ends.</text>
  <rect x="40" y="130" width="220" height="100" rx="10" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
  <text x="150" y="163.1" font-size="24" font-weight="700" fill="#1f1f1f" text-anchor="middle">messages</text>
  <text x="150" y="198.3" font-size="17" font-weight="400" fill="#6b6b6b" text-anchor="middle">user · assistant</text>
  <text x="150" y="220.4" font-size="17" font-weight="400" fill="#6b6b6b" text-anchor="middle">tool_result</text>
  <rect x="330" y="130" width="270" height="100" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="465" y="173.55" font-size="22" font-weight="700" fill="#d4600b" text-anchor="middle">Call the model</text>
  <text x="465" y="206.15" font-size="17" font-weight="400" fill="#6b6b6b" text-anchor="middle">client.messages.create</text>
  <path d="M266,180 L324,180" fill="none" stroke="#d4600b" stroke-width="2.5" marker-end="url(#aaccent)"/>
  <text x="150" y="118" font-size="26" font-weight="700" fill="#d4600b" text-anchor="middle">1</text>
  <text x="465" y="118" font-size="26" font-weight="700" fill="#d4600b" text-anchor="middle">2</text>
  <path d="M606,180 L664,180" fill="none" stroke="#d4600b" stroke-width="2.5" marker-end="url(#aaccent)"/>
  <rect x="670" y="130" width="270" height="100" rx="10" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
  <text x="805" y="173.55" font-size="22" font-weight="700" fill="#1f1f1f" text-anchor="middle">Check stop_reason</text>
  <text x="805" y="206.15" font-size="17" font-weight="400" fill="#6b6b6b" text-anchor="middle">is it tool_use?</text>
  <text x="805" y="118" font-size="26" font-weight="700" fill="#d4600b" text-anchor="middle">3</text>
  <path d="M946,180 L1004,180" fill="none" stroke="#a8a49c" stroke-width="2" marker-end="url(#agrey)"/>
  <text x="975" y="168" font-size="17" font-weight="400" fill="#6b6b6b" text-anchor="middle">no</text>
  <rect x="1010" y="130" width="150" height="100" rx="9" fill="#ffffff" stroke="#e3dfd7" stroke-width="1.5"/>
  <text x="1085" y="172.7" font-size="17" font-weight="700" fill="#9a968e" text-anchor="middle">Return the answer</text>
  <text x="1085" y="198.8" font-size="16" font-weight="400" fill="#9a968e" text-anchor="middle">end_turn</text>
  <path d="M805,236 L805,384" fill="none" stroke="#d4600b" stroke-width="2.5" marker-end="url(#aaccent)"/>
  <text x="817" y="315" font-size="17" font-weight="400" fill="#6b6b6b">yes: tool_use</text>
  <rect x="664" y="384" width="282" height="112" rx="12" fill="#e9c9ae"/>
  <rect x="670" y="390" width="270" height="100" rx="9" fill="#fcefe5" stroke="#d4600b" stroke-width="2.5"/>
  <text x="805" y="423.8" font-size="22" font-weight="700" fill="#d4600b" text-anchor="middle">Run the tool</text>
  <text x="805" y="456.4" font-size="16" font-weight="400" fill="#6b6b6b" text-anchor="middle">run_tool(...)</text>
  <text x="805" y="477.2" font-size="16" font-weight="400" fill="#6b6b6b" text-anchor="middle">our code does the work</text>
  <text x="805" y="540" font-size="26" font-weight="700" fill="#d4600b" text-anchor="middle">4</text>
  <path d="M664,440 L606,440" fill="none" stroke="#d4600b" stroke-width="2.5" marker-end="url(#aaccent)"/>
  <rect x="330" y="390" width="270" height="100" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="465" y="433.25" font-size="21" font-weight="700" fill="#d4600b" text-anchor="middle">Wrap as tool_result</text>
  <text x="465" y="464.55" font-size="17" font-weight="400" fill="#6b6b6b" text-anchor="middle">same id as the request</text>
  <path d="M324,440 L266,440" fill="none" stroke="#d4600b" stroke-width="2.5" marker-end="url(#aaccent)"/>
  <rect x="40" y="390" width="220" height="100" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="150" y="432.65" font-size="19" font-weight="700" fill="#d4600b" text-anchor="middle">Append to messages</text>
  <text x="150" y="461.35" font-size="17" font-weight="400" fill="#6b6b6b" text-anchor="middle">as a user message</text>
  <text x="465" y="540" font-size="26" font-weight="700" fill="#d4600b" text-anchor="middle">5</text>
  <path d="M150,384 L150,236" fill="none" stroke="#d4600b" stroke-width="4" marker-end="url(#aaccent)"/>
  <text x="162" y="315" font-size="17" font-weight="400" fill="#6b6b6b">back to step 2</text>
  <text x="40" y="610" font-size="19" font-weight="400" fill="#8a8a8a">The whole loop: call the model, check stop_reason, run the tool, append the result, repeat.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker><marker id="aaccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d4600b"/></marker><marker id="agrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8a49c"/></marker></defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="40" y="52" font-size="21" font-weight="700" fill="#1f1f1f">Where notes files live: broad to specific, joined together</text>
  <rect x="60" y="100" width="260" height="76" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="190" y="144.6" font-size="22" font-weight="700" fill="#d4600b" text-anchor="middle">Organisation</text>
  <text x="350" y="146" font-size="20" font-weight="600" fill="#1f1f1f">managed policy: one file in a system folder</text>
  <rect x="60" y="200" width="260" height="76" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="190" y="244.6" font-size="22" font-weight="700" fill="#d4600b" text-anchor="middle">You</text>
  <text x="350" y="246" font-size="20" font-weight="600" fill="#1f1f1f">~/.claude/CLAUDE.md · all your projects</text>
  <rect x="54" y="294" width="272" height="88" rx="12" fill="#e9c9ae"/>
  <rect x="60" y="300" width="260" height="76" rx="9" fill="#fcefe5" stroke="#d4600b" stroke-width="2.5"/>
  <text x="190" y="344.6" font-size="22" font-weight="700" fill="#d4600b" text-anchor="middle">Project</text>
  <text x="350" y="346" font-size="20" font-weight="600" fill="#1f1f1f">./CLAUDE.md · can be shared with the team</text>
  <rect x="60" y="400" width="260" height="76" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="190" y="444.6" font-size="22" font-weight="700" fill="#d4600b" text-anchor="middle">You + project</text>
  <text x="350" y="446" font-size="20" font-weight="600" fill="#1f1f1f">./CLAUDE.local.md · not committed</text>
  <path d="M1150,580 L1150,110" fill="none" stroke="#d4600b" stroke-width="2.5" marker-end="url(#aaccent)"/>
  <text x="840" y="300" font-size="20" font-weight="700" fill="#d4600b">from the working directory</text>
  <text x="840" y="332" font-size="20" font-weight="700" fill="#d4600b">up through every parent</text>
  <rect x="60" y="520" width="560" height="90" rx="9" fill="#ffffff" stroke="#a8a49c" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="340" y="558.25" font-size="21" font-weight="700" fill="#6b6b6b" text-anchor="middle">Notes in a subfolder</text>
  <text x="340" y="589.55" font-size="17" font-weight="400" fill="#6b6b6b" text-anchor="middle">loaded when Claude reads or writes a file there</text>
  <text x="660" y="574" font-size="20" font-weight="700" fill="#d4600b">All found files are joined, not overridden</text>
</svg>

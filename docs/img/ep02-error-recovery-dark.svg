  <text x="460" y="353" font-size="20" font-weight="700" fill="#f0883e" text-anchor="middle">3. read_file(calc.py)</text>
  <path d="M692,433 L230,433" fill="none" stroke="#6f6a63" stroke-width="2" stroke-dasharray="10 7" marker-end="url(#agrey)"/>
  <text x="460" y="419" font-size="20" font-weight="400" fill="#aca69d" text-anchor="middle">4. file contents</text>
  <path d="M228,499 L690,499" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#aaccent)"/>

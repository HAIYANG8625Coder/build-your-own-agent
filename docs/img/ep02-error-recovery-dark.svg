  <line x1="220" y1="186" x2="220" y2="620" stroke="#4d4842" stroke-width="2" stroke-dasharray="3 7"/>
  <rect x="580" y="110" width="240" height="70" rx="10" fill="#2a2723" stroke="#ece8e1" stroke-width="2.5"/>
  <text x="700" y="151.6" font-size="22" font-weight="700" fill="#ece8e1" text-anchor="middle">agent.py</text>
  <line x1="700" y1="186" x2="700" y2="620" stroke="#4d4842" stroke-width="2" stroke-dasharray="3 7"/>
  <path d="M228,235 L690,235" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#aaccent)"/>
  <text x="460" y="221" font-size="20" font-weight="700" fill="#f0883e" text-anchor="middle">1. edit_file (file not read yet)</text>
  <path d="M692,301 L230,301" fill="none" stroke="#6f6a63" stroke-width="2" stroke-dasharray="10 7" marker-end="url(#agrey)"/>

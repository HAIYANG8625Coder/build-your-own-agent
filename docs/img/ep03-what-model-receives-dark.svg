<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ece8e1"/></marker><marker id="aaccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="agrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f6a63"/></marker></defs>
  <rect width="1200" height="600" fill="#0d1117"/>
  <text x="40" y="52" font-size="21" font-weight="700" fill="#ece8e1">What the model receives on every call</text>
  <rect x="40" y="90" width="540" height="470" rx="14" fill="#1c1a17"/>
  <text x="310" y="128" font-size="17" font-weight="700" fill="#ece8e1" text-anchor="middle">system (the system prompt)</text>
  <rect x="70" y="150" width="480" height="100" rx="9" fill="#2a2723" stroke="#4a4640" stroke-width="1.5"/>
  <text x="310" y="194.15" font-size="24" font-weight="700" fill="#f0883e" text-anchor="middle">Role</text>
  <text x="310" y="229.35" font-size="17" font-weight="400" fill="#aca69d" text-anchor="middle">a small coding assistant</text>
  <rect x="70" y="272" width="480" height="100" rx="9" fill="#2a2723" stroke="#4a4640" stroke-width="1.5"/>
  <text x="310" y="316.15" font-size="24" font-weight="700" fill="#f0883e" text-anchor="middle">Rules</text>
  <text x="310" y="351.35" font-size="17" font-weight="400" fill="#aca69d" text-anchor="middle">look first · read before edit · run tests</text>
  <rect x="70" y="394" width="480" height="100" rx="9" fill="#2a2723" stroke="#4a4640" stroke-width="1.5"/>
  <text x="310" y="438.15" font-size="24" font-weight="700" fill="#f0883e" text-anchor="middle">Environment</text>
  <text x="310" y="473.35" font-size="17" font-weight="400" fill="#aca69d" text-anchor="middle">project folder · platform</text>
  <rect x="620" y="90" width="540" height="470" rx="14" fill="#1c1a17"/>
  <text x="890" y="128" font-size="17" font-weight="700" fill="#ece8e1" text-anchor="middle">messages</text>
  <rect x="650" y="150" width="480" height="250" rx="14" fill="#1c1a17"/>
  <text x="890" y="188" font-size="17" font-weight="700" fill="#ece8e1" text-anchor="middle">first user message</text>
  <rect x="670" y="194" width="440" height="86" rx="12" fill="#6b4024"/>
  <rect x="676" y="200" width="428" height="74" rx="9" fill="#3d2616" stroke="#f0883e" stroke-width="2.5"/>
  <text x="890" y="230.55" font-size="22" font-weight="700" fill="#f0883e" text-anchor="middle">Notes (NOTES.md)</text>
  <text x="890" y="263.15" font-size="17" font-weight="400" fill="#aca69d" text-anchor="middle">only if the file exists</text>
  <rect x="676" y="296" width="428" height="74" rx="9" fill="#2a2723" stroke="#4a4640" stroke-width="1.5"/>
  <text x="890" y="326.55" font-size="22" font-weight="700" fill="#f0883e" text-anchor="middle">Task</text>
  <text x="890" y="359.15" font-size="17" font-weight="400" fill="#aca69d" text-anchor="middle">Task: ...</text>
  <rect x="650" y="424" width="480" height="100" rx="9" fill="#2a2723" stroke="#6f6a63" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="890" y="479.7" font-size="19" font-weight="700" fill="#aca69d" text-anchor="middle">then: assistant · tool_result ...</text>
  <text x="40" y="586" font-size="17" font-weight="400" fill="#8f8a82">The notes go in the first user message, not in the system prompt: as Claude Code does with CLAUDE.md.</text>
</svg>

  <text x="220" y="184.6" font-size="19" font-weight="700" fill="#d4600b" text-anchor="middle">Notes folder</text>
  <text x="220" y="213.3" font-size="14" font-weight="400" fill="#6b6b6b" text-anchor="middle">only what can't be looked up</text>
  <path d="M220,234 L220,286" fill="none" stroke="#d4600b" stroke-width="2.5" marker-end="url(#aaccent)"/>

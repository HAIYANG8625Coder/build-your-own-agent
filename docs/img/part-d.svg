  <text x="600" y="175.4" font-size="18" font-weight="700" fill="#d4600b" text-anchor="middle">Inbox · timers</text>
  <path d="M600,204 L600,236" fill="none" stroke="#d4600b" stroke-width="2.5" marker-end="url(#aaccent)"/>
  <rect x="444" y="234" width="312" height="82" rx="12" fill="#e9c9ae"/>

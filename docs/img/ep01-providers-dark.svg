<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ece8e1"/></marker><marker id="aaccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="agrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f6a63"/></marker></defs>
  <rect width="1200" height="520" fill="#0d1117"/>
  <text x="40" y="50" font-size="21" font-weight="700" fill="#ece8e1">Same code, two models: change one environment variable</text>
  <rect x="450" y="190" width="300" height="130" rx="10" fill="#2a2723" stroke="#ece8e1" stroke-width="2.5"/>
  <text x="600" y="238.7" font-size="26" font-weight="700" fill="#ece8e1" text-anchor="middle">agent.py</text>
  <text x="600" y="276.5" font-size="17" font-weight="400" fill="#aca69d" text-anchor="middle">Anthropic message format</text>
  <text x="600" y="298.6" font-size="17" font-weight="400" fill="#aca69d" text-anchor="middle">tool_use · tool_result</text>
  <rect x="40" y="190" width="300" height="130" rx="9" fill="#2a2723" stroke="#4a4640" stroke-width="1.5"/>
  <text x="190" y="249.15" font-size="24" font-weight="700" fill="#f0883e" text-anchor="middle">Claude API</text>
  <text x="190" y="284.35" font-size="17" font-weight="400" fill="#aca69d" text-anchor="middle">claude-haiku-5-5</text>
  <path d="M446,255 L346,255" fill="none" stroke="#ece8e1" stroke-width="2" marker-end="url(#aink)" marker-start="url(#aink)"/>
  <text x="110" y="360" font-size="20" font-weight="700" fill="#aca69d">PROVIDER=claude</text>
  <text x="95" y="388" font-size="18" font-weight="400" fill="#8f8a82">ANTHROPIC_API_KEY</text>
  <rect x="854" y="184" width="312" height="142" rx="12" fill="#6b4024"/>
  <rect x="860" y="190" width="300" height="130" rx="9" fill="#3d2616" stroke="#f0883e" stroke-width="2.5"/>
  <text x="1010" y="249.15" font-size="24" font-weight="700" fill="#f0883e" text-anchor="middle">DeepSeek API</text>
  <text x="1010" y="284.35" font-size="17" font-weight="400" fill="#aca69d" text-anchor="middle">deepseek-flash</text>
  <path d="M754,255 L854,255" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#aaccent)" marker-start="url(#aaccent)"/>
  <text x="880" y="360" font-size="20" font-weight="700" fill="#f0883e">PROVIDER=deepseek</text>
  <text x="895" y="388" font-size="18" font-weight="400" fill="#8f8a82">DEEPSEEK_API_KEY</text>
  <text x="1010" y="150" font-size="20" font-weight="700" fill="#f0883e" text-anchor="middle">used in the videos</text>
  <text x="1010" y="172" font-size="17" font-weight="400" fill="#8f8a82" text-anchor="middle">api.deepseek.com/anthropic</text>
  <text x="40" y="480" font-size="18" font-weight="400" fill="#8f8a82">DeepSeek offers an Anthropic-compatible endpoint, so only the key, the address and the model name change.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker><marker id="aaccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d4600b"/></marker><marker id="agrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8a49c"/></marker></defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="40" y="52" font-size="21" font-weight="700" fill="#1f1f1f">The gate sits between the model's request and the run</text>
  <rect x="40" y="150" width="240" height="100" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="160" y="194.75" font-size="26" font-weight="700" fill="#d4600b" text-anchor="middle">Model</text>
  <text x="160" y="232.55" font-size="17" font-weight="400" fill="#6b6b6b" text-anchor="middle">I want to run this</text>
  <rect x="394" y="124" width="272" height="152" rx="12" fill="#e9c9ae"/>
  <rect x="400" y="130" width="260" height="140" rx="9" fill="#fcefe5" stroke="#d4600b" stroke-width="2.5"/>
  <text x="530" y="194.65" font-size="30" font-weight="700" fill="#d4600b" text-anchor="middle">Gate</text>
  <text x="530" y="237.65" font-size="19" font-weight="400" fill="#6b6b6b" text-anchor="middle">check · gated</text>
  <rect x="800" y="150" width="240" height="100" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="920" y="194.15" font-size="24" font-weight="700" fill="#d4600b" text-anchor="middle">Run the tool</text>
  <text x="920" y="229.35" font-size="17" font-weight="400" fill="#6b6b6b" text-anchor="middle">run_tool</text>
  <path d="M286,200 L394,200" fill="none" stroke="#d4600b" stroke-width="2.5" marker-end="url(#aaccent)"/>
  <text x="340" y="188" font-size="17" font-weight="400" fill="#6b6b6b" text-anchor="middle">tool_use</text>
  <path d="M666,200 L794,200" fill="none" stroke="#d4600b" stroke-width="2.5" marker-end="url(#aaccent)"/>
  <text x="730" y="188" font-size="19" font-weight="400" fill="#6b6b6b" text-anchor="middle">allow</text>
  <path d="M530,276 L530,346" fill="none" stroke="#1f1f1f" stroke-width="2" marker-end="url(#aink)"/>
  <text x="542" y="316" font-size="19" font-weight="400" fill="#6b6b6b">ask</text>
  <rect x="400" y="352" width="260" height="90" rx="10" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
  <text x="530" y="391.15" font-size="24" font-weight="700" fill="#1f1f1f" text-anchor="middle">Ask the user</text>
  <text x="530" y="426.35" font-size="17" font-weight="400" fill="#6b6b6b" text-anchor="middle">y · a · n</text>
  <path d="M400,240 L286,240" fill="none" stroke="#a8a49c" stroke-width="2" stroke-dasharray="10 7" marker-end="url(#agrey)"/>
  <text x="40" y="310" font-size="18" font-weight="700" fill="#6b6b6b">deny: an error goes back to the model</text>
  <text x="40" y="520" font-size="19" font-weight="400" fill="#8a8a8a">Every tool call passes the gate first. Three outcomes: allow, ask, deny.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ece8e1"/></marker><marker id="aaccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="agrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f6a63"/></marker></defs>
  <rect width="1200" height="560" fill="#0d1117"/>
  <text x="40" y="44" font-size="21" font-weight="700" fill="#ece8e1">B  Trust and limits · permissions and context (episodes 4 and 5)</text>
  <rect x="40" y="80" width="540" height="420" rx="14" fill="#1c1a17"/>
  <text x="310" y="118" font-size="17" font-weight="700" fill="#ece8e1" text-anchor="middle">Episode 4 · Permissions</text>
  <rect x="70" y="150" width="200" height="80" rx="9" fill="#2a2723" stroke="#4a4640" stroke-width="1.5"/>
  <text x="170" y="194.8" font-size="16" font-weight="700" fill="#f0883e" text-anchor="middle">Model asks for a tool</text>
  <path d="M274,190 L326,190" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#aaccent)"/>
  <rect x="330" y="140" width="220" height="100" rx="10" fill="#2a2723" stroke="#ece8e1" stroke-width="2.5"/>
  <text x="440" y="184.25" font-size="20" font-weight="700" fill="#ece8e1" text-anchor="middle">Permission gate</text>
  <text x="440" y="214.25" font-size="15" font-weight="400" fill="#aca69d" text-anchor="middle">checks the rules</text>
  <text x="100" y="300" font-size="19" font-weight="700" fill="#3fb950">allow → run it</text>
  <text x="100" y="350" font-size="19" font-weight="700" fill="#f0883e">ask → ask you first</text>
  <text x="100" y="400" font-size="19" font-weight="700" fill="#f85149">deny → return an error</text>
  <text x="70" y="470" font-size="15" font-weight="400" fill="#8f8a82">Rule order: deny, then ask, then allow</text>
  <rect x="620" y="80" width="540" height="420" rx="14" fill="#1c1a17"/>
  <text x="890" y="118" font-size="17" font-weight="700" fill="#ece8e1" text-anchor="middle">Episode 5 · Context</text>
  <rect x="660" y="170" width="110" height="34" rx="4" fill="#4a4640"/>
  <text x="780" y="196" font-size="16" font-weight="400" fill="#aca69d">turn 1</text>
  <rect x="660" y="232" width="250" height="34" rx="4" fill="#4a4640"/>
  <text x="920" y="258" font-size="16" font-weight="400" fill="#aca69d">turn 5</text>
  <rect x="660" y="294" width="400" height="34" rx="4" fill="#f0883e"/>
  <text x="1070" y="320" font-size="16" font-weight="400" fill="#aca69d">turn 20</text>
  <rect x="654" y="374" width="472" height="92" rx="12" fill="#6b4024"/>
  <rect x="660" y="380" width="460" height="80" rx="9" fill="#3d2616" stroke="#f0883e" stroke-width="2.5"/>
  <text x="890" y="413.35" font-size="17" font-weight="700" fill="#f0883e" text-anchor="middle">Compact: old turns become a summary</text>
  <text x="890" y="439.45" font-size="15" font-weight="400" fill="#aca69d" text-anchor="middle">triggered near the limit</text>

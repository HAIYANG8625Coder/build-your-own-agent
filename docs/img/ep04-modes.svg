<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker><marker id="aaccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d4600b"/></marker><marker id="agrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8a49c"/></marker></defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="40" y="52" font-size="21" font-weight="700" fill="#1f1f1f">Four modes: what happens when no rule matches</text>
  <text x="430" y="110" font-size="20" font-weight="700" fill="#6b6b6b" text-anchor="middle">Read · search</text>
  <text x="610" y="110" font-size="20" font-weight="700" fill="#6b6b6b" text-anchor="middle">Read-only cmds</text>
  <text x="790" y="110" font-size="20" font-weight="700" fill="#6b6b6b" text-anchor="middle">Edit a file</text>
  <text x="990" y="110" font-size="20" font-weight="700" fill="#6b6b6b" text-anchor="middle">Other commands</text>
  <rect x="40" y="140" width="260" height="84" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="170" y="188.6" font-size="22" font-weight="700" fill="#d4600b" text-anchor="middle">default</text>
  <text x="430" y="192" font-size="24" font-weight="700" fill="#1e7a3c" text-anchor="middle">allow</text>
  <text x="610" y="192" font-size="24" font-weight="700" fill="#1e7a3c" text-anchor="middle">allow</text>
  <text x="790" y="192" font-size="24" font-weight="700" fill="#d4600b" text-anchor="middle">ask</text>
  <text x="990" y="192" font-size="24" font-weight="700" fill="#d4600b" text-anchor="middle">ask</text>
  <rect x="34" y="244" width="272" height="96" rx="12" fill="#e9c9ae"/>
  <rect x="40" y="250" width="260" height="84" rx="9" fill="#fcefe5" stroke="#d4600b" stroke-width="2.5"/>
  <text x="170" y="298.6" font-size="22" font-weight="700" fill="#d4600b" text-anchor="middle">accept-edits</text>
  <text x="430" y="302" font-size="24" font-weight="700" fill="#1e7a3c" text-anchor="middle">allow</text>
  <text x="610" y="302" font-size="24" font-weight="700" fill="#1e7a3c" text-anchor="middle">allow</text>
  <text x="790" y="302" font-size="24" font-weight="700" fill="#1e7a3c" text-anchor="middle">allow</text>
  <text x="990" y="302" font-size="24" font-weight="700" fill="#d4600b" text-anchor="middle">ask</text>
  <rect x="40" y="360" width="260" height="84" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="170" y="408.6" font-size="22" font-weight="700" fill="#d4600b" text-anchor="middle">read-only</text>
  <text x="430" y="412" font-size="24" font-weight="700" fill="#1e7a3c" text-anchor="middle">allow</text>
  <text x="610" y="412" font-size="24" font-weight="700" fill="#1e7a3c" text-anchor="middle">allow</text>
  <text x="790" y="412" font-size="24" font-weight="700" fill="#c23b22" text-anchor="middle">deny</text>
  <text x="990" y="412" font-size="24" font-weight="700" fill="#c23b22" text-anchor="middle">deny</text>
  <rect x="40" y="470" width="260" height="84" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="170" y="518.6" font-size="22" font-weight="700" fill="#d4600b" text-anchor="middle">dont-ask</text>
  <text x="430" y="522" font-size="24" font-weight="700" fill="#1e7a3c" text-anchor="middle">allow</text>
  <text x="610" y="522" font-size="24" font-weight="700" fill="#1e7a3c" text-anchor="middle">allow</text>
  <text x="790" y="522" font-size="24" font-weight="700" fill="#c23b22" text-anchor="middle">deny</text>
  <text x="990" y="522" font-size="24" font-weight="700" fill="#c23b22" text-anchor="middle">deny</text>
  <text x="40" y="620" font-size="18" font-weight="400" fill="#8a8a8a">dont-ask: commands that an allow rule covers still run; everything that would ask is denied.</text>
</svg>

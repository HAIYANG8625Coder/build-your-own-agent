<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ece8e1"/></marker><marker id="aaccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="agrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f6a63"/></marker></defs>
  <rect width="1200" height="640" fill="#0d1117"/>
  <text x="40" y="52" font-size="21" font-weight="700" fill="#ece8e1">Where notes files live: broad to specific, joined together</text>
  <rect x="60" y="100" width="260" height="76" rx="9" fill="#2a2723" stroke="#4a4640" stroke-width="1.5"/>
  <text x="190" y="144.6" font-size="22" font-weight="700" fill="#f0883e" text-anchor="middle">Organisation</text>
  <text x="350" y="146" font-size="20" font-weight="600" fill="#ece8e1">managed policy: one file in a system folder</text>
  <rect x="60" y="200" width="260" height="76" rx="9" fill="#2a2723" stroke="#4a4640" stroke-width="1.5"/>
  <text x="190" y="244.6" font-size="22" font-weight="700" fill="#f0883e" text-anchor="middle">You</text>
  <text x="350" y="246" font-size="20" font-weight="600" fill="#ece8e1">~/.claude/CLAUDE.md · all your projects</text>
  <rect x="54" y="294" width="272" height="88" rx="12" fill="#6b4024"/>
  <rect x="60" y="300" width="260" height="76" rx="9" fill="#3d2616" stroke="#f0883e" stroke-width="2.5"/>
  <text x="190" y="344.6" font-size="22" font-weight="700" fill="#f0883e" text-anchor="middle">Project</text>
  <text x="350" y="346" font-size="20" font-weight="600" fill="#ece8e1">./CLAUDE.md · can be shared with the team</text>
  <rect x="60" y="400" width="260" height="76" rx="9" fill="#2a2723" stroke="#4a4640" stroke-width="1.5"/>
  <text x="190" y="444.6" font-size="22" font-weight="700" fill="#f0883e" text-anchor="middle">You + project</text>
  <text x="350" y="446" font-size="20" font-weight="600" fill="#ece8e1">./CLAUDE.local.md · not committed</text>
  <path d="M1150,580 L1150,110" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#aaccent)"/>
  <text x="840" y="300" font-size="20" font-weight="700" fill="#f0883e">from the working directory</text>
  <text x="840" y="332" font-size="20" font-weight="700" fill="#f0883e">up through every parent</text>
  <rect x="60" y="520" width="560" height="90" rx="9" fill="#2a2723" stroke="#6f6a63" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="340" y="558.25" font-size="21" font-weight="700" fill="#aca69d" text-anchor="middle">Notes in a subfolder</text>
  <text x="340" y="589.55" font-size="17" font-weight="400" fill="#aca69d" text-anchor="middle">loaded when Claude reads or writes a file there</text>
  <text x="660" y="574" font-size="20" font-weight="700" fill="#f0883e">All found files are joined, not overridden</text>
</svg>

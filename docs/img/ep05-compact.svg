<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker><marker id="aaccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d4600b"/></marker><marker id="agrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8a49c"/></marker></defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="40" y="52" font-size="21" font-weight="700" fill="#1f1f1f">Compaction: the old turns become one summary</text>
  <rect x="40" y="130" width="300" height="120" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="190" y="184.7" font-size="28" font-weight="700" fill="#d4600b" text-anchor="middle">Old turns</text>
  <text x="190" y="225.1" font-size="18" font-weight="400" fill="#6b6b6b" text-anchor="middle">all but the last 4</text>
  <rect x="434" y="124" width="312" height="132" rx="12" fill="#e9c9ae"/>
  <rect x="440" y="130" width="300" height="120" rx="9" fill="#fcefe5" stroke="#d4600b" stroke-width="2.5"/>
  <text x="590" y="182.3" font-size="20" font-weight="700" fill="#d4600b" text-anchor="middle">The model writes a summary</text>
  <text x="590" y="212.3" font-size="18" font-weight="400" fill="#6b6b6b" text-anchor="middle">fixed prompt</text>
  <rect x="840" y="130" width="320" height="120" rx="10" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
  <text x="1000" y="186.65" font-size="28" font-weight="700" fill="#1f1f1f" text-anchor="middle">One summary</text>
  <text x="1000" y="227.05" font-size="15" font-weight="400" fill="#6b6b6b" text-anchor="middle">task · decisions · files · open items · next step</text>
  <path d="M346,190 L434,190" fill="none" stroke="#d4600b" stroke-width="3" marker-end="url(#aaccent)"/>
  <path d="M746,190 L834,190" fill="none" stroke="#d4600b" stroke-width="3" marker-end="url(#aaccent)"/>
  <rect x="40" y="300" width="1120" height="220" rx="14" fill="#f0ede6"/>
  <text x="600" y="338" font-size="17" font-weight="700" fill="#1f1f1f" text-anchor="middle">The message list afterwards</text>
  <rect x="70" y="350" width="300" height="100" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="220" y="393.55" font-size="22" font-weight="700" fill="#d4600b" text-anchor="middle">Task + notes</text>
  <text x="220" y="426.15" font-size="17" font-weight="400" fill="#6b6b6b" text-anchor="middle">first message, unchanged</text>
  <rect x="394" y="344" width="312" height="112" rx="12" fill="#e9c9ae"/>
  <rect x="400" y="350" width="300" height="100" rx="9" fill="#fcefe5" stroke="#d4600b" stroke-width="2.5"/>
  <text x="550" y="392.65" font-size="19" font-weight="700" fill="#d4600b" text-anchor="middle">Summary + files touched</text>
  <text x="550" y="421.35" font-size="17" font-weight="400" fill="#6b6b6b" text-anchor="middle">appended to the first message</text>
  <rect x="730" y="350" width="400" height="100" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="930" y="393.55" font-size="22" font-weight="700" fill="#d4600b" text-anchor="middle">Last 4 turns</text>
  <text x="930" y="426.15" font-size="17" font-weight="400" fill="#6b6b6b" text-anchor="middle">kept whole, calls and results paired</text>
  <text x="70" y="490" font-size="19" font-weight="400" fill="#8a8a8a">The same model writes the summary; we do not claim it matches Claude Code's.</text>
</svg>

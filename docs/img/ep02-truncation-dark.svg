<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ece8e1"/></marker><marker id="aaccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="agrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f6a63"/></marker></defs>
  <rect width="1200" height="520" fill="#0d1117"/>
  <text x="40" y="52" font-size="21" font-weight="700" fill="#ece8e1">Don't flood the context: cut long output</text>
  <text x="60" y="130" font-size="21" font-weight="700" fill="#ece8e1">Tool output</text>
  <rect x="60" y="150" width="1000" height="44" rx="4" fill="#4a4640"/>
  <text x="1075" y="182" font-size="18" font-weight="400" fill="#aca69d">20,000 chars</text>
  <text x="60" y="250" font-size="21" font-weight="700" fill="#ece8e1">Returned to the model (our code)</text>
  <rect x="60" y="270" width="200" height="44" rx="4" fill="#f0883e"/>
  <text x="275" y="302" font-size="18" font-weight="700" fill="#f0883e">at most 4,000 chars + "... cut off. Ask for less."</text>
  <rect x="60" y="350" width="1080" height="130" rx="14" fill="#1c1a17"/>
  <text x="90" y="392" font-size="21" font-weight="700" fill="#ece8e1">Claude Code (official docs)</text>
  <text x="90" y="430" font-size="19" font-weight="400" fill="#aca69d">Bash output over about 30,000 characters is saved to a file, with a short preview kept</text>
  <text x="90" y="462" font-size="19" font-weight="400" fill="#aca69d">Anthropic's article: tool responses default to at most 25,000 tokens in Claude Code</text>
</svg>

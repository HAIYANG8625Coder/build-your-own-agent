<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker><marker id="aaccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d4600b"/></marker><marker id="agrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8a49c"/></marker></defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="40" y="44" font-size="21" font-weight="700" fill="#1f1f1f">Course map · 5 parts, 13 episodes</text>
  <text x="40" y="70" font-size="16" font-weight="400" fill="#8a8a8a">Each episode adds one piece to the code from the last one. Orange: published.</text>
  <rect x="40" y="100" width="212" height="440" rx="14" fill="#f0ede6"/>
  <text x="146" y="138" font-size="16" font-weight="700" fill="#1f1f1f" text-anchor="middle">A  Core</text>
  <rect x="48" y="154" width="196" height="104" rx="12" fill="#e9c9ae"/>
  <rect x="54" y="160" width="184" height="92" rx="9" fill="#fcefe5" stroke="#d4600b" stroke-width="2.5"/>
  <text x="146" y="211.4" font-size="18" font-weight="700" fill="#d4600b" text-anchor="middle">1  The loop</text>
  <rect x="54" y="272" width="184" height="92" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="146" y="323.4" font-size="18" font-weight="700" fill="#d4600b" text-anchor="middle">2  Tools</text>
  <rect x="54" y="384" width="184" height="92" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="146" y="435.4" font-size="18" font-weight="700" fill="#d4600b" text-anchor="middle">3  Prompt and notes</text>
  <path d="M254,130 L278,130" fill="none" stroke="#a8a49c" stroke-width="2" marker-end="url(#agrey)"/>
  <rect x="268" y="100" width="212" height="440" rx="14" fill="#f0ede6"/>
  <text x="374" y="138" font-size="16" font-weight="700" fill="#1f1f1f" text-anchor="middle">B  Trust and limits</text>
  <rect x="282" y="160" width="184" height="92" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="374" y="211.4" font-size="18" font-weight="700" fill="#d4600b" text-anchor="middle">4  Permissions</text>
  <rect x="282" y="272" width="184" height="92" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="374" y="323.4" font-size="18" font-weight="700" fill="#d4600b" text-anchor="middle">5  Context</text>
  <path d="M482,130 L506,130" fill="none" stroke="#a8a49c" stroke-width="2" marker-end="url(#agrey)"/>
  <rect x="496" y="100" width="212" height="440" rx="14" fill="#f0ede6"/>
  <text x="602" y="138" font-size="16" font-weight="700" fill="#1f1f1f" text-anchor="middle">C  Working at scale</text>
  <rect x="510" y="160" width="184" height="92" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="602" y="211.4" font-size="18" font-weight="700" fill="#d4600b" text-anchor="middle">6  Plans and tasks</text>
  <rect x="510" y="272" width="184" height="92" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="602" y="323.4" font-size="18" font-weight="700" fill="#d4600b" text-anchor="middle">7  Subagents</text>
  <rect x="510" y="384" width="184" height="92" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="602" y="435.4" font-size="18" font-weight="700" fill="#d4600b" text-anchor="middle">8  Hooks</text>
  <path d="M710,130 L734,130" fill="none" stroke="#a8a49c" stroke-width="2" marker-end="url(#agrey)"/>
  <rect x="724" y="100" width="212" height="440" rx="14" fill="#f0ede6"/>
  <text x="830" y="138" font-size="16" font-weight="700" fill="#1f1f1f" text-anchor="middle">D  Beyond one session</text>
  <rect x="738" y="160" width="184" height="92" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="830" y="211.4" font-size="18" font-weight="700" fill="#d4600b" text-anchor="middle">9  Memory</text>
  <rect x="738" y="272" width="184" height="92" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="830" y="323.4" font-size="18" font-weight="700" fill="#d4600b" text-anchor="middle">10  Always on</text>
  <rect x="738" y="384" width="184" height="92" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="830" y="435.4" font-size="18" font-weight="700" fill="#d4600b" text-anchor="middle">11  MCP and skills</text>
  <path d="M938,130 L962,130" fill="none" stroke="#a8a49c" stroke-width="2" marker-end="url(#agrey)"/>
  <rect x="952" y="100" width="212" height="440" rx="14" fill="#f0ede6"/>
  <text x="1058" y="138" font-size="16" font-weight="700" fill="#1f1f1f" text-anchor="middle">E  Ship it</text>
  <rect x="966" y="160" width="184" height="92" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="1058" y="211.4" font-size="18" font-weight="700" fill="#d4600b" text-anchor="middle">12  Testing</text>
  <rect x="966" y="272" width="184" height="92" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="1058" y="323.4" font-size="18" font-weight="700" fill="#d4600b" text-anchor="middle">13  Put it together</text>
  <text x="40" y="580" font-size="16" font-weight="400" fill="#8a8a8a">A: it runs. B: you can trust it. C: it handles big tasks. D: it works over time. E: you can test and ship it.</text>
</svg>
